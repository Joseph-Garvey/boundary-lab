[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boundary-lab"
version = "0.4.2"
description = "Boundary element loudspeaker radiation solver"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beat-engine @ https://github.com/Joseph-Garvey/BEAT_Engine/releases/download/v0.2.0/beat_engine-0.2.0-py3-none-any.whl#sha256=cef1a40c86d842fa073291da62bbe92b642099d1d59835f92efeca21e9312263",
  "gmsh",
  "matplotlib",
  "meshio",
  "numpy",
  "scipy",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff>=0.15,<0.16",
]
gui = [
  "PySide6",
  "pyvista>=0.47",
  "pyvistaqt",
]

[project.scripts]
blab = "blab.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/blab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests", "scripts"]
force-exclude = true
extend-exclude = [
  "ath/",
  "runs/",
  "references/",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/benchmark_gui_pipeline.py" = ["E402"]
